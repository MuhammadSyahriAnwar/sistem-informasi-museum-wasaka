<!DOCTYPE html>
<html>
<head>
<title>Virtual Tour - Museum Wasaka</title>
<meta charset="utf-8">
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
<style> @-ms-viewport { width: device-width; } </style>

<!-- PERBAIKAN 1: Import Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="vendor/reset.min.css">
<link rel="stylesheet" href="style.css">

<!-- TAMBAHAN: Bootstrap CSS untuk Modal Pop-up -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- PERBAIKAN 2: CSS Tambahan untuk Mengatasi Konflik Tampilan Teks (Tema Elegan) -->
<style>
  /* Mengubah Font Global ke Plus Jakarta Sans */
  body {
    font-family: 'Plus Jakarta Sans', sans-serif !important;
  }
  
  /* Memperbaiki Judul Scene di Atas */
  #titleBar .sceneName {
    font-family: 'Playfair Display', serif !important;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 24px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  }

  /* Memperbaiki Menu List (Menghilangkan biru burik & garis bawah) */
  #sceneList .scene {
    text-decoration: none !important;
  }
  #sceneList .scene .text {
    color: #e0e0e0; /* Warna teks putih keabu-abuan */
    font-weight: 500;
    transition: color 0.3s ease;
  }
  #sceneList .scene:hover .text {
    color: #ffffff; /* Putih terang saat di-hover */
  }
  
  /* Memberikan aksen Emas pada menu scene yang sedang aktif */
  #sceneList .scene.current .text {
    color: #C5A059 !important; 
    font-weight: 700;
  }
</style>

</head>
<body class="multiple-scenes ">

<div id="pano"></div>

<div id="sceneList">
  <ul class="scenes">
    
      <a href="javascript:void(0)" class="scene" data-id="0-lobby-kiri">
        <li class="text">Lobby Kiri</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="1-lobby-kanan">
        <li class="text">Lobby Kanan</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="2-tengah-kiri">
        <li class="text">Tengah Kiri</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="3-tengah-kanan">
        <li class="text">Tengah Kanan</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="4-ujung-kiri">
        <li class="text">Ujung Kiri</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="5-ujung-tengah">
        <li class="text">Ujung Tengah</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="6-ujung-kanan">
        <li class="text">Ujung Kanan</li>
      </a>
    
  </ul>
</div>

<div id="titleBar">
  <h1 class="sceneName"></h1>
</div>

<a href="javascript:void(0)" id="autorotateToggle">
  <img class="icon off" src="img/play.png">
  <img class="icon on" src="img/pause.png">
</a>

<a href="javascript:void(0)" id="fullscreenToggle">
  <img class="icon off" src="img/fullscreen.png">
  <img class="icon on" src="img/windowed.png">
</a>

<a href="javascript:void(0)" id="sceneListToggle">
  <img class="icon off" src="img/expand.png">
  <img class="icon on" src="img/collapse.png">
</a>

<a href="javascript:void(0)" id="viewUp" class="viewControlButton viewControlButton-1">
  <img class="icon" src="img/up.png">
</a>
<a href="javascript:void(0)" id="viewDown" class="viewControlButton viewControlButton-2">
  <img class="icon" src="img/down.png">
</a>
<a href="javascript:void(0)" id="viewLeft" class="viewControlButton viewControlButton-3">
  <img class="icon" src="img/left.png">
</a>
<a href="javascript:void(0)" id="viewRight" class="viewControlButton viewControlButton-4">
  <img class="icon" src="img/right.png">
</a>
<a href="javascript:void(0)" id="viewIn" class="viewControlButton viewControlButton-5">
  <img class="icon" src="img/plus.png">
</a>
<a href="javascript:void(0)" id="viewOut" class="viewControlButton viewControlButton-6">
  <img class="icon" src="img/minus.png">
</a>

<!-- TAMBAHAN: Struktur HTML untuk Modal Pop-up (Tema Gelap-Emas) -->
<div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background-color: #1a1a1a; border: 1px solid #C5A059;">
      <div class="modal-header" style="border-bottom: 1px solid #C5A059;">
        <h5 class="modal-title fw-bold" id="modalTitle" style="color: #C5A059; font-family: 'Playfair Display', serif;">Judul Koleksi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-white" id="modalBody" style="line-height: 1.6; font-family: 'Plus Jakarta Sans', sans-serif;">
        Detail koleksi akan muncul di sini.
      </div>
    </div>
  </div>
</div>

<!-- TAMBAHAN: Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="vendor/screenfull.min.js" ></script>
<script src="vendor/bowser.min.js" ></script>
<script src="vendor/marzipano.js" ></script>

<script src="data.js"></script>
<script src="index.js"></script>

</body>
</html>
